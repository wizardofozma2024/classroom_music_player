<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Classroom Music Player - Enhanced</title>
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
    <link rel="manifest" href="/site.webmanifest">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            min-height: 100vh;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: background 0.5s ease;
        }

        /* Theme Variables */
        body.theme-purple { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); }
        body.theme-ocean { background: linear-gradient(135deg, #2193b0 0%, #6dd5ed 100%); }
        body.theme-sunset { background: linear-gradient(135deg, #f12711 0%, #f5af19 100%); }
        body.theme-forest { background: linear-gradient(135deg, #134e5e 0%, #71b280 100%); }
        body.theme-fire { background: linear-gradient(135deg, #ff0844 0%, #ffb199 100%); }
        body.theme-midnight { background: linear-gradient(135deg, #000428 0%, #004e92 100%); }
        body.theme-cotton-candy { background: linear-gradient(135deg, #fbc2eb 0%, #a6c1ee 100%); }
        body.theme-neon { background: linear-gradient(135deg, #00d2ff 0%, #3a47d5 100%); }

        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            max-width: 900px;
            width: 100%;
            overflow: hidden;
        }

        .player-section {
            padding: 30px;
            color: white;
            position: relative;
            background: transparent;
        }

        body.theme-purple .player-section { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); }
        body.theme-ocean .player-section { background: linear-gradient(135deg, #2193b0 0%, #6dd5ed 100%); }
        body.theme-sunset .player-section { background: linear-gradient(135deg, #f12711 0%, #f5af19 100%); }
        body.theme-forest .player-section { background: linear-gradient(135deg, #134e5e 0%, #71b280 100%); }
        body.theme-fire .player-section { background: linear-gradient(135deg, #ff0844 0%, #ffb199 100%); }
        body.theme-midnight .player-section { background: linear-gradient(135deg, #000428 0%, #004e92 100%); }
        body.theme-cotton-candy .player-section { background: linear-gradient(135deg, #fbc2eb 0%, #a6c1ee 100%); }
        body.theme-neon .player-section { background: linear-gradient(135deg, #00d2ff 0%, #3a47d5 100%); }

        .player-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .player-header h1 {
            font-size: 24px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .playlist-name {
            cursor: pointer;
            padding: 5px 10px;
            border-radius: 8px;
            transition: all 0.3s;
        }

        .playlist-name:hover {
            background: rgba(255,255,255,0.1);
        }

        .playlist-name-input {
            background: rgba(255,255,255,0.2);
            border: 2px solid rgba(255,255,255,0.4);
            color: white;
            padding: 5px 10px;
            border-radius: 8px;
            font-size: 24px;
            font-weight: 600;
            font-family: inherit;
            width: 250px;
        }

        .playlist-name-input:focus {
            outline: none;
            background: rgba(255,255,255,0.3);
            border-color: rgba(255,255,255,0.6);
        }

        .header-buttons {
            display: flex;
            gap: 10px;
        }

        .theme-change-btn, .toggle-library-btn {
            background: rgba(255,255,255,0.2);
            border: 2px solid rgba(255,255,255,0.3);
            color: white;
            padding: 8px 16px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 13px;
            transition: all 0.3s;
        }

        .theme-change-btn:hover, .toggle-library-btn:hover {
            background: rgba(255,255,255,0.3);
            transform: translateY(-2px);
        }

        /* Playlist Manager */
        .playlist-manager {
            background: rgba(255,255,255,0.1);
            padding: 15px;
            border-radius: 15px;
            margin-bottom: 20px;
            backdrop-filter: blur(10px);
        }

        .playlist-selector {
            display: flex;
            gap: 10px;
            align-items: center;
            flex-wrap: wrap;
        }

        .playlist-select {
            background: rgba(255,255,255,0.2);
            border: 2px solid rgba(255,255,255,0.3);
            color: white;
            padding: 8px 15px;
            border-radius: 10px;
            cursor: pointer;
            font-size: 14px;
            flex: 1;
            min-width: 150px;
        }

        .playlist-select:focus {
            outline: none;
            background: rgba(255,255,255,0.3);
        }

        .playlist-select option {
            background: #333;
            color: white;
        }

        .playlist-btn {
            background: rgba(255,255,255,0.2);
            border: 2px solid rgba(255,255,255,0.3);
            color: white;
            padding: 8px 15px;
            border-radius: 10px;
            cursor: pointer;
            font-size: 13px;
            transition: all 0.3s;
        }

        .playlist-btn:hover {
            background: rgba(255,255,255,0.3);
        }

        .now-playing {
            background: rgba(255,255,255,0.1);
            padding: 20px;
            border-radius: 15px;
            margin-bottom: 20px;
            backdrop-filter: blur(10px);
        }

        .now-playing h3 {
            font-size: 14px;
            opacity: 0.8;
            margin-bottom: 8px;
        }

        .song-title {
            font-size: 22px;
            font-weight: 700;
            margin-bottom: 5px;
        }

        .song-artist {
            font-size: 16px;
            opacity: 0.9;
        }

        /* Progress Bar */
        .progress-section {
            margin: 20px 0;
        }

        .progress-bar {
            width: 100%;
            height: 6px;
            background: rgba(255,255,255,0.2);
            border-radius: 3px;
            cursor: pointer;
            position: relative;
            margin-bottom: 8px;
        }

        .progress-fill {
            height: 100%;
            background: white;
            border-radius: 3px;
            width: 0%;
            transition: width 0.1s;
        }

        .time-display {
            display: flex;
            justify-content: space-between;
            font-size: 12px;
            opacity: 0.8;
        }

        /* Controls */
        .controls {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
            margin-top: 20px;
        }

        .control-btn {
            background: white;
            color: #333;
            border: none;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }

        .control-btn:hover {
            transform: scale(1.1);
            box-shadow: 0 6px 20px rgba(0,0,0,0.3);
        }

        .control-btn.play-pause {
            width: 60px;
            height: 60px;
            font-size: 24px;
        }

        .control-btn.active {
            background: #4CAF50;
            color: white;
        }

        /* Volume Control */
        .volume-control {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-top: 15px;
            justify-content: center;
        }

        .volume-icon {
            font-size: 20px;
        }

        .volume-slider {
            width: 150px;
            height: 6px;
            border-radius: 3px;
            background: rgba(255,255,255,0.2);
            outline: none;
            -webkit-appearance: none;
        }

        .volume-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 16px;
            height: 16px;
            border-radius: 50%;
            background: white;
            cursor: pointer;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
        }

        .volume-slider::-moz-range-thumb {
            width: 16px;
            height: 16px;
            border-radius: 50%;
            background: white;
            cursor: pointer;
            border: none;
        }

        /* Playlist Section */
        .playlist-section {
            padding: 20px 30px;
            max-height: 300px;
            overflow-y: auto;
        }

        .playlist-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        .playlist-header h3 {
            color: #333;
            font-size: 18px;
        }

        .playlist-actions {
            display: flex;
            gap: 10px;
        }

        .action-btn {
            background: #f0f0f0;
            border: none;
            padding: 6px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 12px;
            transition: all 0.3s;
        }

        .action-btn:hover {
            background: #e0e0e0;
        }

        .song-counter {
            font-size: 13px;
            color: #666;
        }

        .playlist-item {
            background: #f7f7f7;
            padding: 12px 15px;
            border-radius: 10px;
            margin-bottom: 8px;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .playlist-item:hover {
            background: #e9e9e9;
            transform: translateX(5px);
        }

        .playlist-item.active {
            background: rgba(102, 126, 234, 0.9);
            color: white;
        }

        body.theme-purple .playlist-item.active { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); }
        body.theme-ocean .playlist-item.active { background: linear-gradient(135deg, #2193b0 0%, #6dd5ed 100%); }
        body.theme-sunset .playlist-item.active { background: linear-gradient(135deg, #f12711 0%, #f5af19 100%); }
        body.theme-forest .playlist-item.active { background: linear-gradient(135deg, #134e5e 0%, #71b280 100%); }
        body.theme-fire .playlist-item.active { background: linear-gradient(135deg, #ff0844 0%, #ffb199 100%); }
        body.theme-midnight .playlist-item.active { background: linear-gradient(135deg, #000428 0%, #004e92 100%); }
        body.theme-cotton-candy .playlist-item.active { background: linear-gradient(135deg, #fbc2eb 0%, #a6c1ee 100%); }
        body.theme-neon .playlist-item.active { background: linear-gradient(135deg, #00d2ff 0%, #3a47d5 100%); }

        .playlist-info {
            flex: 1;
        }

        .playlist-title {
            font-weight: 600;
            font-size: 14px;
        }

        .playlist-artist {
            font-size: 12px;
            opacity: 0.7;
            margin-top: 2px;
        }

        .remove-btn {
            background: #ff4757;
            color: white;
            border: none;
            padding: 5px 10px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 12px;
            transition: all 0.3s;
        }

        .remove-btn:hover {
            background: #ff3838;
        }

        /* Library Section */
        .library-section {
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.3s ease;
            background: #f9f9f9;
        }

        .library-section.open {
            max-height: 500px;
            border-top: 2px solid #e0e0e0;
        }

        .library-content {
            padding: 30px;
        }

        .search-box {
            width: 100%;
            padding: 12px 20px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 14px;
            margin-bottom: 20px;
            transition: all 0.3s;
        }

        .search-box:focus {
            outline: none;
            border-color: #667eea;
        }

        body.theme-purple .search-box:focus { border-color: #667eea; }
        body.theme-ocean .search-box:focus { border-color: #2193b0; }
        body.theme-sunset .search-box:focus { border-color: #f12711; }
        body.theme-forest .search-box:focus { border-color: #134e5e; }
        body.theme-fire .search-box:focus { border-color: #ff0844; }
        body.theme-midnight .search-box:focus { border-color: #004e92; }
        body.theme-cotton-candy .search-box:focus { border-color: #a6c1ee; }
        body.theme-neon .search-box:focus { border-color: #3a47d5; }

        .library-list {
            max-height: 350px;
            overflow-y: auto;
        }

        .library-item {
            background: white;
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 10px;
            cursor: pointer;
            transition: all 0.3s;
            border: 2px solid transparent;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .library-item:hover {
            border-color: #667eea;
            transform: translateX(5px);
        }

        body.theme-purple .library-item:hover { border-color: #667eea; }
        body.theme-ocean .library-item:hover { border-color: #2193b0; }
        body.theme-sunset .library-item:hover { border-color: #f12711; }
        body.theme-forest .library-item:hover { border-color: #134e5e; }
        body.theme-fire .library-item:hover { border-color: #ff0844; }
        body.theme-midnight .library-item:hover { border-color: #004e92; }
        body.theme-cotton-candy .library-item:hover { border-color: #a6c1ee; }
        body.theme-neon .library-item:hover { border-color: #3a47d5; }

        .library-info {
            flex: 1;
        }

        .library-title {
            font-weight: 600;
            color: #333;
            font-size: 15px;
        }

        .library-artist {
            color: #666;
            font-size: 13px;
            margin-top: 3px;
        }

        .add-btn {
            background: #667eea;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 600;
            transition: all 0.3s;
        }

        .add-btn:hover {
            background: #5568d3;
            transform: scale(1.05);
        }

        body.theme-purple .add-btn { background: #667eea; }
        body.theme-ocean .add-btn { background: #2193b0; }
        body.theme-sunset .add-btn { background: #f12711; }
        body.theme-forest .add-btn { background: #134e5e; }
        body.theme-fire .add-btn { background: #ff0844; }
        body.theme-midnight .add-btn { background: #004e92; }
        body.theme-cotton-candy .add-btn { background: #a6c1ee; }
        body.theme-neon .add-btn { background: #3a47d5; }

        .empty-state {
            text-align: center;
            padding: 40px 20px;
            color: #999;
        }

        .empty-state p {
            margin-bottom: 15px;
        }

        /* Theme Selector Popup */
        .theme-selector {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: white;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.3);
            z-index: 1000;
            display: none;
        }

        .theme-selector.open {
            display: block;
        }

        .theme-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.5);
            z-index: 999;
            display: none;
        }

        .theme-overlay.open {
            display: block;
        }

        .theme-selector h3 {
            color: #333;
            margin-bottom: 20px;
            font-size: 20px;
            text-align: center;
        }

        .theme-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 15px;
            margin-bottom: 20px;
        }

        .theme-option {
            width: 60px;
            height: 60px;
            border-radius: 15px;
            cursor: pointer;
            border: 3px solid transparent;
            transition: all 0.3s;
            box-shadow: 0 2px 8px rgba(0,0,0,0.2);
            position: relative;
        }

        .theme-option:hover {
            transform: scale(1.1);
            border-color: #333;
        }

        .theme-option.active {
            border-color: #333;
            box-shadow: 0 0 0 3px rgba(0,0,0,0.2);
        }

        .theme-option.active::after {
            content: '✓';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: white;
            font-size: 24px;
            font-weight: bold;
            text-shadow: 0 2px 4px rgba(0,0,0,0.3);
        }

        .theme-label {
            text-align: center;
            font-size: 11px;
            color: #666;
            margin-top: 5px;
        }

        .theme-item {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .close-theme-btn {
            background: #f0f0f0;
            border: none;
            padding: 10px 20px;
            border-radius: 10px;
            cursor: pointer;
            font-size: 14px;
            width: 100%;
            transition: all 0.3s;
        }

        .close-theme-btn:hover {
            background: #e0e0e0;
        }

        .theme-purple-dot { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); }
        .theme-ocean-dot { background: linear-gradient(135deg, #2193b0 0%, #6dd5ed 100%); }
        .theme-sunset-dot { background: linear-gradient(135deg, #f12711 0%, #f5af19 100%); }
        .theme-forest-dot { background: linear-gradient(135deg, #134e5e 0%, #71b280 100%); }
        .theme-fire-dot { background: linear-gradient(135deg, #ff0844 0%, #ffb199 100%); }
        .theme-midnight-dot { background: linear-gradient(135deg, #000428 0%, #004e92 100%); }
        .theme-cotton-candy-dot { background: linear-gradient(135deg, #fbc2eb 0%, #a6c1ee 100%); }
        .theme-neon-dot { background: linear-gradient(135deg, #00d2ff 0%, #3a47d5 100%); }

        ::-webkit-scrollbar {
            width: 8px;
        }

        ::-webkit-scrollbar-track {
            background: #f1f1f1;
            border-radius: 10px;
        }

        ::-webkit-scrollbar-thumb {
            background: #667eea;
            border-radius: 10px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: #5568d3;
        }

        body.theme-purple ::-webkit-scrollbar-thumb { background: #667eea; }
        body.theme-ocean ::-webkit-scrollbar-thumb { background: #2193b0; }
        body.theme-sunset ::-webkit-scrollbar-thumb { background: #f12711; }
        body.theme-forest ::-webkit-scrollbar-thumb { background: #134e5e; }
        body.theme-fire ::-webkit-scrollbar-thumb { background: #ff0844; }
        body.theme-midnight ::-webkit-scrollbar-thumb { background: #004e92; }
        body.theme-cotton-candy ::-webkit-scrollbar-thumb { background: #a6c1ee; }
        body.theme-neon ::-webkit-scrollbar-thumb { background: #3a47d5; }
    </style>
</head>
<body class="theme-purple">
    <div class="container">
        <!-- Theme Selector Popup -->
        <div class="theme-overlay" id="themeOverlay" onclick="closeThemeSelector()"></div>
        <div class="theme-selector" id="themeSelector">
            <h3>Choose Your Theme</h3>
            <div class="theme-grid">
                <div class="theme-item">
                    <div class="theme-option theme-purple-dot active" onclick="changeTheme('purple')" data-theme="purple"></div>
                    <div class="theme-label">Purple</div>
                </div>
                <div class="theme-item">
                    <div class="theme-option theme-ocean-dot" onclick="changeTheme('ocean')" data-theme="ocean"></div>
                    <div class="theme-label">Ocean</div>
                </div>
                <div class="theme-item">
                    <div class="theme-option theme-sunset-dot" onclick="changeTheme('sunset')" data-theme="sunset"></div>
                    <div class="theme-label">Sunset</div>
                </div>
                <div class="theme-item">
                    <div class="theme-option theme-forest-dot" onclick="changeTheme('forest')" data-theme="forest"></div>
                    <div class="theme-label">Forest</div>
                </div>
                <div class="theme-item">
                    <div class="theme-option theme-fire-dot" onclick="changeTheme('fire')" data-theme="fire"></div>
                    <div class="theme-label">Hot Pink</div>
                </div>
                <div class="theme-item">
                    <div class="theme-option theme-midnight-dot" onclick="changeTheme('midnight')" data-theme="midnight"></div>
                    <div class="theme-label">Midnight</div>
                </div>
                <div class="theme-item">
                    <div class="theme-option theme-cotton-candy-dot" onclick="changeTheme('cotton-candy')" data-theme="cotton-candy"></div>
                    <div class="theme-label">Cotton Candy</div>
                </div>
                <div class="theme-item">
                    <div class="theme-option theme-neon-dot" onclick="changeTheme('neon')" data-theme="neon"></div>
                    <div class="theme-label">Neon</div>
                </div>
            </div>
            <button class="close-theme-btn" onclick="closeThemeSelector()">Done</button>
        </div>

        <!-- Player Section -->
        <div class="player-section">
            <div class="player-header">
                <h1>
                    🎵 <span class="playlist-name" id="playlistName" onclick="editPlaylistName()">My Playlist</span>
                </h1>
                <div class="header-buttons">
                    <button class="theme-change-btn" onclick="openThemeSelector()">🎨 Theme</button>
                    <button class="toggle-library-btn" onclick="toggleLibrary()">
                        <span id="toggleText">Browse Songs</span>
                    </button>
                </div>
            </div>

            <!-- Playlist Manager -->
            <div class="playlist-manager">
                <div class="playlist-selector">
                    <select class="playlist-select" id="playlistSelect" onchange="switchPlaylist()">
                        <option value="default">My Playlist</option>
                    </select>
                    <button class="playlist-btn" onclick="createNewPlaylist()">+ New</button>
                    <button class="playlist-btn" onclick="deletePlaylist()">🗑️ Delete</button>
                </div>
            </div>

            <div class="now-playing">
                <h3>NOW PLAYING</h3>
                <div class="song-title" id="currentTitle">No song selected</div>
                <div class="song-artist" id="currentArtist">Choose a song to start</div>
            </div>

            <!-- Progress Bar -->
            <div class="progress-section">
                <div class="progress-bar" onclick="seekTo(event)">
                    <div class="progress-fill" id="progressFill"></div>
                </div>
                <div class="time-display">
                    <span id="currentTime">0:00</span>
                    <span id="totalTime">0:00</span>
                </div>
            </div>

            <audio id="audioPlayer" style="display: none;"></audio>

            <div class="controls">
                <button class="control-btn" onclick="toggleShuffle()" id="shuffleBtn" title="Shuffle">🔀</button>
                <button class="control-btn" onclick="previousSong()">⏮</button>
                <button class="control-btn play-pause" onclick="togglePlay()" id="playPauseBtn">▶️</button>
                <button class="control-btn" onclick="nextSong()">⏭</button>
                <button class="control-btn" onclick="toggleLoop()" id="loopBtn" title="Loop off">🔁</button>
            </div>

            <!-- Volume Control -->
            <div class="volume-control">
                <span class="volume-icon" id="volumeIcon">🔊</span>
                <input type="range" class="volume-slider" id="volumeSlider" min="0" max="100" value="70" oninput="changeVolume()">
            </div>
        </div>

        <!-- Current Playlist -->
        <div class="playlist-section">
            <div class="playlist-header">
                <div>
                    <h3>Current Playlist</h3>
                    <div class="song-counter" id="songCounter">0 songs</div>
                </div>
                <div class="playlist-actions">
                    <button class="action-btn" onclick="clearPlaylist()">🗑️ Clear All</button>
                </div>
            </div>
            <div id="playlistContainer">
                <div class="empty-state">
                    <p>Your playlist is empty</p>
                    <p style="font-size: 14px;">Click "Browse Songs" to add music</p>
                </div>
            </div>
        </div>

        <!-- Song Library (Collapsible) -->
        <div class="library-section" id="librarySection">
            <div class="library-content">
                <input type="text" class="search-box" id="searchBox" placeholder="Search for songs or artists..." onkeyup="filterSongs()">
                
                <div class="library-list" id="libraryList">
                    <!-- Songs will load here from Google Sheets -->
                </div>
            </div>
        </div>
    </div>

    <script>
        // ============================================
        // CONFIGURATION
        // ============================================
        const SHEETS_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vRsw-3Vw4hBz0_UuhFK8X6P0QaXeCWyUYEQ_vNyqZ-YvAMZspkcTV9HuUe7WsyeTwAVChOfetr9P1ho/pub?output=csv";
        
        // ============================================
        // STATE MANAGEMENT
        // ============================================
        let songDatabase = [];
        let allPlaylists = {}; // Stores all playlists
        let currentPlaylistId = 'default';
        let currentSongIndex = -1;
        const audioPlayer = document.getElementById('audioPlayer');
        let isShuffled = false;
        let shuffledPlaylist = [];
        let loopMode = 'off'; // 'off', 'playlist', 'one'

        // ============================================
        // INITIALIZATION
        // ============================================
        function init() {
            loadTheme();
            loadPlaylists();
            loadSongsFromSheet();
            setupAudioPlayer();
            setupKeyboardShortcuts();
            updatePlaylistSelector();
            switchPlaylist();
        }

        // ============================================
        // PLAYLIST MANAGEMENT
        // ============================================
        function loadPlaylists() {
            const saved = localStorage.getItem('allPlaylists');
            if (saved) {
                allPlaylists = JSON.parse(saved);
            } else {
                allPlaylists = {
                    'default': {
                        name: 'My Playlist',
                        songs: []
                    }
                };
            }
            const savedCurrent = localStorage.getItem('currentPlaylistId');
            if (savedCurrent && allPlaylists[savedCurrent]) {
                currentPlaylistId = savedCurrent;
            }
        }

        function savePlaylists() {
            localStorage.setItem('allPlaylists', JSON.stringify(allPlaylists));
            localStorage.setItem('currentPlaylistId', currentPlaylistId);
        }

        function getCurrentPlaylist() {
            if (!allPlaylists[currentPlaylistId]) {
                currentPlaylistId = 'default';
            }
            return allPlaylists[currentPlaylistId].songs || [];
        }

        function setCurrentPlaylist(songs) {
            allPlaylists[currentPlaylistId].songs = songs;
            savePlaylists();
        }

        function updatePlaylistSelector() {
            const select = document.getElementById('playlistSelect');
            select.innerHTML = '';
            
            for (let id in allPlaylists) {
                const option = document.createElement('option');
                option.value = id;
                option.textContent = allPlaylists[id].name;
                if (id === currentPlaylistId) {
                    option.selected = true;
                }
                select.appendChild(option);
            }
        }

        function switchPlaylist() {
            const select = document.getElementById('playlistSelect');
            currentPlaylistId = select.value;
            
            // Update display name
            document.getElementById('playlistName').textContent = allPlaylists[currentPlaylistId].name;
            
            // Stop current playback
            audioPlayer.pause();
            currentSongIndex = -1;
            
            // Update display
            updatePlaylistDisplay();
            document.getElementById('currentTitle').textContent = 'No song selected';
            document.getElementById('currentArtist').textContent = 'Choose a song to start';
            
            savePlaylists();
        }

        function createNewPlaylist() {
            const name = prompt('Enter playlist name:');
            if (name && name.trim()) {
                const id = 'playlist_' + Date.now();
                allPlaylists[id] = {
                    name: name.trim(),
                    songs: []
                };
                currentPlaylistId = id;
                updatePlaylistSelector();
                switchPlaylist();
            }
        }

        function deletePlaylist() {
            if (currentPlaylistId === 'default') {
                alert('Cannot delete the default playlist!');
                return;
            }
            
            if (confirm('Delete this playlist? This cannot be undone.')) {
                delete allPlaylists[currentPlaylistId];
                currentPlaylistId = 'default';
                updatePlaylistSelector();
                switchPlaylist();
            }
        }

        function clearPlaylist() {
            if (confirm('Clear all songs from this playlist?')) {
                setCurrentPlaylist([]);
                audioPlayer.pause();
                currentSongIndex = -1;
                updatePlaylistDisplay();
                document.getElementById('currentTitle').textContent = 'No song selected';
                document.getElementById('currentArtist').textContent = 'Choose a song to start';
            }
        }

        // ============================================
        // THEME MANAGEMENT
        // ============================================
        function openThemeSelector() {
            document.getElementById('themeSelector').classList.add('open');
            document.getElementById('themeOverlay').classList.add('open');
        }

        function closeThemeSelector() {
            document.getElementById('themeSelector').classList.remove('open');
            document.getElementById('themeOverlay').classList.remove('open');
        }

        function changeTheme(themeName) {
            document.body.className = '';
            document.body.classList.add('theme-' + themeName);
            
            document.querySelectorAll('.theme-option').forEach(option => {
                option.classList.remove('active');
            });
            document.querySelector('[data-theme="' + themeName + '"]').classList.add('active');
            
            localStorage.setItem('musicPlayerTheme', themeName);
        }

        function loadTheme() {
            const savedTheme = localStorage.getItem('musicPlayerTheme') || 'purple';
            changeTheme(savedTheme);
        }

        // ============================================
        // PLAYLIST NAME EDITING
        // ============================================
        function editPlaylistName() {
            const nameSpan = document.getElementById('playlistName');
            const currentName = nameSpan.textContent;
            
            const input = document.createElement('input');
            input.type = 'text';
            input.className = 'playlist-name-input';
            input.value = currentName;
            input.maxLength = 30;
            
            nameSpan.replaceWith(input);
            input.focus();
            input.select();
            
            function saveName() {
                const newName = input.value.trim() || allPlaylists[currentPlaylistId].name;
                allPlaylists[currentPlaylistId].name = newName;
                
                const newSpan = document.createElement('span');
                newSpan.className = 'playlist-name';
                newSpan.id = 'playlistName';
                newSpan.textContent = newName;
                newSpan.onclick = editPlaylistName;
                
                input.replaceWith(newSpan);
                updatePlaylistSelector();
                savePlaylists();
            }
            
            input.addEventListener('blur', saveName);
            input.addEventListener('keypress', function(e) {
                if (e.key === 'Enter') {
                    saveName();
                }
            });
        }

        // ============================================
        // SONG DATABASE
        // ============================================
        async function loadSongsFromSheet() {
            const libraryList = document.getElementById('libraryList');
            
            try {
                libraryList.innerHTML = '<div class="empty-state"><p>Loading songs...</p></div>';

                const response = await fetch(SHEETS_URL);
                
                if (!response.ok) {
                    throw new Error('Failed to fetch sheet');
                }
                
                const csvText = await response.text();
                const lines = csvText.split('\n');
                songDatabase = [];
                
                for (let i = 1; i < lines.length; i++) {
                    const line = lines[i].trim();
                    if (line) {
                        const values = parseCSVLine(line);
                        
                        if (values.length >= 3 && values[0] && values[1] && values[2]) {
                            songDatabase.push({
                                title: values[0].trim(),
                                artist: values[1].trim(),
                                url: values[2].trim()
                            });
                        }
                    }
                }
                
                if (songDatabase.length === 0) {
                    libraryList.innerHTML = '<div class="empty-state"><p>No songs found</p><p style="font-size: 14px;">Check your Google Sheets URL and format</p></div>';
                } else {
                    initializeLibrary();
                }
                
            } catch (error) {
                console.error('Error loading songs:', error);
                libraryList.innerHTML = '<div class="empty-state"><p>Error loading songs</p><p style="font-size: 14px;">Make sure your sheet is published and the URL is correct</p></div>';
            }
        }

        function parseCSVLine(line) {
            const result = [];
            let current = '';
            let inQuotes = false;
            
            for (let i = 0; i < line.length; i++) {
                const char = line[i];
                
                if (char === '"') {
                    inQuotes = !inQuotes;
                } else if (char === ',' && !inQuotes) {
                    result.push(current);
                    current = '';
                } else {
                    current += char;
                }
            }
            result.push(current);
            
            return result;
        }

        function initializeLibrary() {
            const libraryList = document.getElementById('libraryList');
            libraryList.innerHTML = '';
            
            songDatabase.forEach((song, index) => {
                const item = document.createElement('div');
                item.className = 'library-item';
                item.innerHTML = `
                    <div class="library-info">
                        <div class="library-title">${song.title}</div>
                        <div class="library-artist">${song.artist}</div>
                    </div>
                    <button class="add-btn" onclick="addToPlaylist(${index})">+ Add</button>
                `;
                libraryList.appendChild(item);
            });
        }

        function filterSongs() {
            const searchTerm = document.getElementById('searchBox').value.toLowerCase();
            const libraryList = document.getElementById('libraryList');
            libraryList.innerHTML = '';
            
            const filtered = songDatabase.filter(song => 
                song.title.toLowerCase().includes(searchTerm) || 
                song.artist.toLowerCase().includes(searchTerm)
            );
            
            if (filtered.length === 0) {
                libraryList.innerHTML = '<div class="empty-state"><p>No songs found</p></div>';
                return;
            }
            
            filtered.forEach(song => {
                const index = songDatabase.indexOf(song);
                const item = document.createElement('div');
                item.className = 'library-item';
                item.innerHTML = `
                    <div class="library-info">
                        <div class="library-title">${song.title}</div>
                        <div class="library-artist">${song.artist}</div>
                    </div>
                    <button class="add-btn" onclick="addToPlaylist(${index})">+ Add</button>
                `;
                libraryList.appendChild(item);
            });
        }

        function toggleLibrary() {
            const library = document.getElementById('librarySection');
            const toggleText = document.getElementById('toggleText');
            
            library.classList.toggle('open');
            
            if (library.classList.contains('open')) {
                toggleText.textContent = 'Hide Library';
            } else {
                toggleText.textContent = 'Browse Songs';
            }
        }

        // ============================================
        // PLAYLIST OPERATIONS
        // ============================================
        function addToPlaylist(index) {
            const song = songDatabase[index];
            const playlist = getCurrentPlaylist();
            
            if (playlist.some(s => s.url === song.url)) {
                alert('This song is already in your playlist!');
                return;
            }
            
            playlist.push(song);
            setCurrentPlaylist(playlist);
            updatePlaylistDisplay();
            
            if (playlist.length === 1) {
                playSong(0);
            }
        }

        function removeFromPlaylist(index) {
            const playlist = getCurrentPlaylist();
            
            if (index === currentSongIndex) {
                audioPlayer.pause();
                currentSongIndex = -1;
            } else if (index < currentSongIndex) {
                currentSongIndex--;
            }
            
            playlist.splice(index, 1);
            setCurrentPlaylist(playlist);
            updatePlaylistDisplay();
            
            if (playlist.length === 0) {
                document.getElementById('currentTitle').textContent = 'No song selected';
                document.getElementById('currentArtist').textContent = 'Choose a song to start';
            }
        }

        function updatePlaylistDisplay() {
            const container = document.getElementById('playlistContainer');
            const playlist = getCurrentPlaylist();
            
            // Update song counter
            document.getElementById('songCounter').textContent = `${playlist.length} song${playlist.length !== 1 ? 's' : ''}`;
            
            if (playlist.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <p>Your playlist is empty</p>
                        <p style="font-size: 14px;">Click "Browse Songs" to add music</p>
                    </div>
                `;
                return;
            }
            
            container.innerHTML = '';
            playlist.forEach((song, index) => {
                const item = document.createElement('div');
                item.className = 'playlist-item';
                if (index === currentSongIndex) {
                    item.classList.add('active');
                }
                
                item.innerHTML = `
                    <div class="playlist-info" onclick="playSong(${index})">
                        <div class="playlist-title">${song.title}</div>
                        <div class="playlist-artist">${song.artist}</div>
                    </div>
                    <button class="remove-btn" onclick="removeFromPlaylist(${index})">Remove</button>
                `;
                container.appendChild(item);
            });
        }

        // ============================================
        // PLAYBACK CONTROLS
        // ============================================
        function setupAudioPlayer() {
            audioPlayer.volume = 0.7;
            
            audioPlayer.addEventListener('timeupdate', updateProgress);
            audioPlayer.addEventListener('ended', handleSongEnd);
            audioPlayer.addEventListener('loadedmetadata', updateTotalTime);
        }

        function playSong(index) {
            const playlist = getCurrentPlaylist();
            if (index < 0 || index >= playlist.length) return;
            
            currentSongIndex = index;
            const song = playlist[index];
            
            audioPlayer.src = song.url;
            audioPlayer.play();
            
            document.getElementById('currentTitle').textContent = song.title;
            document.getElementById('currentArtist').textContent = song.artist;
            document.getElementById('playPauseBtn').textContent = '⏸';
            
            updatePlaylistDisplay();
        }

        function togglePlay() {
            const playlist = getCurrentPlaylist();
            
            if (playlist.length === 0) {
                alert('Add songs to your playlist first!');
                return;
            }
            
            if (audioPlayer.paused) {
                if (currentSongIndex === -1) {
                    playSong(0);
                } else {
                    audioPlayer.play();
                    document.getElementById('playPauseBtn').textContent = '⏸';
                }
            } else {
                audioPlayer.pause();
                document.getElementById('playPauseBtn').textContent = '▶️';
            }
        }

        function nextSong() {
            const playlist = getCurrentPlaylist();
            if (playlist.length === 0) return;
            
            let nextIndex;
            if (isShuffled && shuffledPlaylist.length > 0) {
                const currentShuffleIndex = shuffledPlaylist.indexOf(currentSongIndex);
                const nextShuffleIndex = (currentShuffleIndex + 1) % shuffledPlaylist.length;
                nextIndex = shuffledPlaylist[nextShuffleIndex];
            } else {
                nextIndex = currentSongIndex + 1;
                if (nextIndex >= playlist.length) {
                    nextIndex = 0;
                }
            }
            playSong(nextIndex);
        }

        function previousSong() {
            const playlist = getCurrentPlaylist();
            if (playlist.length === 0) return;
            
            // If more than 3 seconds into the song, restart it
            if (audioPlayer.currentTime > 3) {
                audioPlayer.currentTime = 0;
                return;
            }
            
            let prevIndex;
            if (isShuffled && shuffledPlaylist.length > 0) {
                const currentShuffleIndex = shuffledPlaylist.indexOf(currentSongIndex);
                const prevShuffleIndex = (currentShuffleIndex - 1 + shuffledPlaylist.length) % shuffledPlaylist.length;
                prevIndex = shuffledPlaylist[prevShuffleIndex];
            } else {
                prevIndex = currentSongIndex - 1;
                if (prevIndex < 0) {
                    prevIndex = playlist.length - 1;
                }
            }
            playSong(prevIndex);
        }

        function handleSongEnd() {
            if (loopMode === 'one') {
                audioPlayer.currentTime = 0;
                audioPlayer.play();
            } else if (loopMode === 'playlist') {
                nextSong();
            } else {
                const playlist = getCurrentPlaylist();
                if (currentSongIndex < playlist.length - 1 || isShuffled) {
                    nextSong();
                } else {
                    document.getElementById('playPauseBtn').textContent = '▶️';
                }
            }
        }

        // ============================================
        // SHUFFLE & LOOP
        // ============================================
        function toggleShuffle() {
            isShuffled = !isShuffled;
            const btn = document.getElementById('shuffleBtn');
            
            if (isShuffled) {
                btn.classList.add('active');
                btn.title = 'Shuffle on';
                createShuffledPlaylist();
            } else {
                btn.classList.remove('active');
                btn.title = 'Shuffle off';
                shuffledPlaylist = [];
            }
        }

        function createShuffledPlaylist() {
            const playlist = getCurrentPlaylist();
            shuffledPlaylist = [...Array(playlist.length).keys()];
            
            // Fisher-Yates shuffle
            for (let i = shuffledPlaylist.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [shuffledPlaylist[i], shuffledPlaylist[j]] = [shuffledPlaylist[j], shuffledPlaylist[i]];
            }
        }

        function toggleLoop() {
            const btn = document.getElementById('loopBtn');
            
            if (loopMode === 'off') {
                loopMode = 'playlist';
                btn.classList.add('active');
                btn.title = 'Loop playlist';
            } else if (loopMode === 'playlist') {
                loopMode = 'one';
                btn.textContent = '🔂';
                btn.title = 'Loop one song';
            } else {
                loopMode = 'off';
                btn.classList.remove('active');
                btn.textContent = '🔁';
                btn.title = 'Loop off';
            }
        }

        // ============================================
        // VOLUME CONTROL
        // ============================================
        function changeVolume() {
            const slider = document.getElementById('volumeSlider');
            const icon = document.getElementById('volumeIcon');
            const volume = slider.value / 100;
            
            audioPlayer.volume = volume;
            
            if (volume === 0) {
                icon.textContent = '🔇';
            } else if (volume < 0.5) {
                icon.textContent = '🔉';
            } else {
                icon.textContent = '🔊';
            }
        }

        // ============================================
        // PROGRESS BAR
        // ============================================
        function updateProgress() {
            const progress = (audioPlayer.currentTime / audioPlayer.duration) * 100;
            document.getElementById('progressFill').style.width = progress + '%';
            document.getElementById('currentTime').textContent = formatTime(audioPlayer.currentTime);
        }

        function updateTotalTime() {
            document.getElementById('totalTime').textContent = formatTime(audioPlayer.duration);
        }

        function seekTo(event) {
            const progressBar = event.currentTarget;
            const clickX = event.offsetX;
            const width = progressBar.offsetWidth;
            const percentage = clickX / width;
            
            audioPlayer.currentTime = percentage * audioPlayer.duration;
        }

        function formatTime(seconds) {
            if (isNaN(seconds)) return '0:00';
            
            const mins = Math.floor(seconds / 60);
            const secs = Math.floor(seconds % 60);
            return `${mins}:${secs.toString().padStart(2, '0')}`;
        }

        // ============================================
        // KEYBOARD SHORTCUTS
        // ============================================
        function setupKeyboardShortcuts() {
            document.addEventListener('keydown', function(e) {
                // Don't trigger if typing in input
                if (e.target.tagName === 'INPUT') return;
                
                switch(e.key) {
                    case ' ':
                        e.preventDefault();
                        togglePlay();
                        break;
                    case 'ArrowRight':
                        e.preventDefault();
                        nextSong();
                        break;
                    case 'ArrowLeft':
                        e.preventDefault();
                        previousSong();
                        break;
                    case 'ArrowUp':
                        e.preventDefault();
                        const slider = document.getElementById('volumeSlider');
                        slider.value = Math.min(100, parseInt(slider.value) + 10);
                        changeVolume();
                        break;
                    case 'ArrowDown':
                        e.preventDefault();
                        const slider2 = document.getElementById('volumeSlider');
                        slider2.value = Math.max(0, parseInt(slider2.value) - 10);
                        changeVolume();
                        break;
                }
            });
        }

        // ============================================
        // INITIALIZE
        // ============================================
        init();
    </script>
</body>
</html>
